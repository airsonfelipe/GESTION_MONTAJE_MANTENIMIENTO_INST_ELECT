let state = {};
let currentSection = 'all';

function initQuiz() {
  const container = document.getElementById('questions-container');
  container.innerHTML = '';

  const letters = ['a', 'b', 'c', 'd'];

  questions.forEach((q) => {
    if (currentSection !== 'all' && q.section !== currentSection) return;

    const card = document.createElement('div');
    card.className = 'question-card';
    card.id = `q-card-${q.id}`;

    let html = `
      <div class="question-header">
        <span class="badge">${q.category}</span>
      </div>
      <div class="question-title">${q.question}</div>
      ${q.svg ? q.svg : ''}
    `;

    if (q.type === 'single') {
      const answered = state[q.id];
      html += `<div class="options-list">`;
      q.options.forEach((opt, idx) => {
        let btnClass = 'option-btn';
        let disabled = '';
        if (answered !== undefined) {
          disabled = 'disabled';
          if (idx === q.correct) btnClass += ' correct';
          else if (idx === answered.selected && !answered.isCorrect) btnClass += ' incorrect';
        }
        html += `
          <button class="${btnClass}" ${disabled} onclick="answerSingle(${q.id}, ${idx})">
            <span class="option-letter">${letters[idx]}.</span>
            <span>${opt}</span>
          </button>
        `;
      });
      html += `</div>`;

      if (answered !== undefined) {
        html += `<div class="feedback ${answered.isCorrect ? 'correct' : 'incorrect'}">
          ${answered.isCorrect ? '✔ ¡Respuesta correcta!' : `✘ Respuesta incorrecta. La respuesta correcta es la (${letters[q.correct]}).`}
        </div>`;
      } else {
        html += `<div class="feedback" id="feedback-${q.id}"></div>`;
      }
    } else if (q.type === 'multiple') {
      const answered = state[q.id];
      const tempSelected = (answered && answered.selected) ? answered.selected : [];
      html += `<div class="options-list" id="multi-list-${q.id}">`;
      q.options.forEach((opt, idx) => {
        let btnClass = 'option-btn';
        let disabled = '';
        if (answered && answered.submitted) {
          disabled = 'disabled';
          if (q.correct.includes(idx)) btnClass += ' correct';
          else if (tempSelected.includes(idx)) btnClass += ' incorrect';
        } else if (tempSelected.includes(idx)) {
          btnClass += ' selected-multi';
        }
        html += `
          <button class="${btnClass}" ${disabled} onclick="toggleMulti(${q.id}, ${idx})">
            <span class="option-letter">${letters[idx]}.</span>
            <span>${opt}</span>
          </button>
        `;
      });
      html += `</div>`;

      if (!answered || !answered.submitted) {
        html += `<button class="verify-multi-btn" onclick="submitMulti(${q.id})">Comprobar respuesta</button>`;
        html += `<div class="feedback" id="feedback-${q.id}"></div>`;
      } else {
        html += `<div class="feedback ${answered.isCorrect ? 'correct' : 'incorrect'}">
          ${answered.isCorrect ? '✔ ¡Respuesta correcta! Has marcado todas las opciones válidas.' : '✘ Respuesta incompleta o incorrecta. Las opciones correctas son: a, c y d.'}
        </div>`;
      }
    } else if (q.type === 'open') {
      const savedText = (state[q.id] && state[q.id].text) ? state[q.id].text : '';
      html += `
        <textarea class="open-area" placeholder="Escribe aquí tu desarrollo, explicación o los cálculos paso a paso..." oninput="saveOpenText(${q.id}, this.value)">${savedText}</textarea>
        <div>
          <button class="guide-toggle" onclick="toggleGuide(${q.id})">👁️ Mostrar / Ocultar guía de resolución</button>
          <div class="guide-box" id="guide-${q.id}">${q.guide}</div>
        </div>
      `;
    }

    card.innerHTML = html;
    container.appendChild(card);
  });

  updateStats();
}

function answerSingle(qId, selectedIdx) {
  const q = questions.find(item => item.id === qId);
  if (!q || state[qId]) return;

  const isCorrect = (selectedIdx === q.correct);
  state[qId] = { selected: selectedIdx, isCorrect, submitted: true };
  initQuiz();
}

function toggleMulti(qId, idx) {
  if (!state[qId]) state[qId] = { selected: [], submitted: false };
  if (state[qId].submitted) return;

  const pos = state[qId].selected.indexOf(idx);
  if (pos === -1) state[qId].selected.push(idx);
  else state[qId].selected.splice(pos, 1);

  initQuiz();
}

function submitMulti(qId) {
  const q = questions.find(item => item.id === qId);
  if (!state[qId] || state[qId].selected.length === 0) {
    alert('Selecciona al menos una opción antes de comprobar.');
    return;
  }

  const sel = state[qId].selected.slice().sort();
  const cor = q.correct.slice().sort();
  const isCorrect = (sel.length === cor.length && sel.every((v, i) => v === cor[i]));

  state[qId].isCorrect = isCorrect;
  state[qId].submitted = true;
  initQuiz();
}

function saveOpenText(qId, val) {
  state[qId] = { text: val };
}

function toggleGuide(qId) {
  const box = document.getElementById(`guide-${qId}`);
  if (box.style.display === 'block') {
    box.style.display = 'none';
  } else {
    box.style.display = 'block';
  }
}

function updateStats() {
  const totalClosed = questions.filter(q => q.type !== 'open').length;
  let answeredCount = 0;
  let correctCount = 0;
  let wrongCount = 0;

  questions.forEach(q => {
    if (q.type !== 'open' && state[q.id] && state[q.id].submitted) {
      answeredCount++;
      if (state[q.id].isCorrect) correctCount++;
      else wrongCount++;
    }
  });

  const score = totalClosed > 0 ? ((correctCount / totalClosed) * 10).toFixed(2) : '0.00';

  document.getElementById('stat-total').textContent = totalClosed;
  document.getElementById('stat-answered').textContent = answeredCount;
  document.getElementById('stat-correct').textContent = correctCount;
  document.getElementById('stat-wrong').textContent = wrongCount;
  document.getElementById('stat-score').textContent = score;
}

function filterSection(sec, btn) {
  currentSection = sec;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  initQuiz();
}

function resetQuiz() {
  if (confirm('¿Quieres reiniciar todas tus respuestas y empezar de cero?')) {
    state = {};
    initQuiz();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
}

initQuiz();
</script>
